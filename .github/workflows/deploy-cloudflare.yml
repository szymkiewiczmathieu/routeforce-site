name: Deploy gettourvia.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tourvia-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build, verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build public artifact
        run: python scripts/build_public.py

      - name: Verify public artifact
        run: python scripts/verify_public.py

      - name: Test redirect behavior
        run: npm run test:redirects

      - name: Test data-readiness checker behavior
        run: npm run test:data-checker

      - name: Test visit-capacity calculator behavior
        run: npm run test:visit-capacity

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy

      - name: Deploy legacy-domain redirect Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ROUTEFORCE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy --config wrangler-redirect.jsonc

      - name: Smoke production
        run: python scripts/smoke_production.py
